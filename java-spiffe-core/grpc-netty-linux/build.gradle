description = "Java SPIFFE Library GRPC-Netty Linux support module"

configurations {
    // core, this module and their runtime dependencies, as an application would put them on the module path
    modulePath
}

dependencies {
    modulePath(project(':java-spiffe-core'))
    modulePath(files(tasks.named('jar')))
    modulePath "io.grpc:grpc-netty-shaded:${grpcVersion}"

    // provided by the application, which always depends on java-spiffe-core
    compileOnly(project(':java-spiffe-core'))
    testImplementation(project(':java-spiffe-core'))

    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
}

jar {
    archiveClassifier = ''
}

tasks.named('test') {
    inputs.files(configurations.modulePath)
    systemProperty 'spiffe.modulepath', configurations.modulePath.asPath
}
